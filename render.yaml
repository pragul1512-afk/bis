services:
  - type: web
    name: bis-setu
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
    disk:
      name: bis-setu-data
      mountPath: /app/data
      sizeGB: 1

